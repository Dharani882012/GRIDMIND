services:
  - type: web
    name: gridmind-api
    runtime: python
    plan: starter
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    disk:
      name: gridmind-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: GRIDMIND_DATA_DIR
        value: /var/data
      - key: CORS_ORIGINS
        value: https://YOUR-VERCEL-PROJECT.vercel.app
